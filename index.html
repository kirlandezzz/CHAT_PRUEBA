<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Void — Chat anónimo cifrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #08080a;
    --surface: #101014;
    --elevated: #18181e;
    --hover: #1f1f28;
    --border: #25252f;
    --border-hi: #35354a;
    --text: #d4d4dc;
    --text-dim: #7a7a8e;
    --text-ghost: #44445a;
    --neon: #00e59b;
    --neon-dim: rgba(0,229,155,0.08);
    --neon-mid: rgba(0,229,155,0.15);
    --neon-glow: rgba(0,229,155,0.35);
    --warn: #ff6b6b;
    --warn-dim: rgba(255,107,107,0.1);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.1);
    --blue: #60a5fa;
    --amber: #fbbf24;
    --font: 'IBM Plex Mono', 'Menlo', monospace;
    --font-display: 'Space Grotesk', sans-serif;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--void);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .screen { display: none; height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ===== ENTRY SCREEN ===== */
  #entry {
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 40px;
    position: relative;
    overflow: hidden;
  }

  #entry::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 60%, rgba(0,229,155,0.03) 0%, transparent 50%);
    animation: drift 20s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-3%, 3%) rotate(2deg); }
  }

  .brand {
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeIn 0.8s ease;
  }

  .brand-icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border: 2px solid var(--neon);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 40px var(--neon-dim), inset 0 0 20px var(--neon-dim);
    position: relative;
    transform: rotate(-6deg);
  }

  .brand-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1px solid rgba(0,229,155,0.1);
    border-radius: 24px;
    animation: pulse-ring 3s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.08); }
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text);
  }

  .brand .tagline {
    font-size: 12px;
    color: var(--text-ghost);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .entry-panel {
    width: 100%;
    max-width: 380px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeUp 0.7s ease 0.15s both;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-size: 10px;
    color: var(--text-ghost);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding-left: 2px;
  }

  input {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }

  input:focus {
    border-color: var(--neon);
    box-shadow: 0 0 0 3px var(--neon-dim);
  }

  input::placeholder { color: var(--text-ghost); }

  .btn {
    padding: 13px 20px;
    border: none;
    border-radius: var(--r-md);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }

  .btn-neon {
    background: var(--neon);
    color: #08080a;
    font-weight: 600;
    box-shadow: 0 4px 20px var(--neon-dim);
  }

  .btn-neon:hover { box-shadow: 0 4px 28px var(--neon-glow); transform: translateY(-1px); }
  .btn-neon:active { transform: translateY(0); }

  .btn-ghost {
    background: var(--elevated);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { background: var(--hover); border-color: var(--border-hi); }

  .separator {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-ghost);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .separator::before, .separator::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .code-row {
    display: flex;
    gap: 8px;
  }

  .code-row input {
    flex: 1;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    font-weight: 500;
  }

  .code-row .btn { flex-shrink: 0; }

  .info-box {
    background: var(--neon-dim);
    border: 1px solid rgba(0,229,155,0.12);
    border-radius: var(--r-md);
    padding: 14px;
    font-size: 11px;
    line-height: 1.7;
    color: var(--text-dim);
    animation: fadeUp 0.7s ease 0.4s both;
  }

  .info-box .feat {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .info-box .feat span {
    color: var(--neon);
    font-size: 13px;
    width: 18px;
    text-align: center;
  }

  /* ===== CHAT SCREEN ===== */
  #chatScreen { background: var(--void); }

  .top-bar {
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    min-height: 52px;
  }

  .top-bar-back {
    width: 34px; height: 34px;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .top-bar-back:hover { background: var(--hover); }

  .top-bar-info { flex: 1; min-width: 0; }

  .top-bar-info h2 {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-bar-info .sub {
    font-size: 10px;
    color: var(--text-ghost);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 1px;
  }

  .dot-live {
    width: 5px; height: 5px;
    background: var(--neon);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--neon-glow);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .lock-badge {
    font-size: 10px;
    color: var(--neon);
    background: var(--neon-dim);
    padding: 3px 8px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    letter-spacing: 0.5px;
  }

  .code-pill {
    font-size: 10px;
    color: var(--purple);
    background: var(--purple-dim);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 2px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }

  .code-pill:hover { background: rgba(167,139,250,0.18); }

  /* messages */
  .msg-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overscroll-behavior: contain;
  }

  .msg-scroll::-webkit-scrollbar { width: 3px; }
  .msg-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .bubble {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: var(--r-md);
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
    animation: msgPop 0.2s ease;
  }

  .bubble.me {
    align-self: flex-end;
    background: var(--neon);
    color: #08080a;
    border-bottom-right-radius: 3px;
  }

  .bubble.them {
    align-self: flex-start;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .bubble .who {
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: 0.3px;
  }

  .bubble.me .who { color: rgba(0,0,0,0.5); }

  .bubble .ts {
    font-size: 9px;
    opacity: 0.45;
    margin-top: 3px;
    text-align: right;
  }

  .sys-msg {
    align-self: center;
    font-size: 10px;
    color: var(--text-ghost);
    padding: 4px 12px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    margin: 6px 0;
    letter-spacing: 0.3px;
  }

  .bubble-gap { height: 6px; }

  /* input area */
  .input-bar {
    padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-bar textarea {
    flex: 1;
    padding: 11px 12px;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.4;
    resize: none;
    outline: none;
    max-height: 110px;
    min-height: 42px;
    transition: border-color 0.2s;
  }

  .input-bar textarea:focus { border-color: var(--neon); }
  .input-bar textarea::placeholder { color: var(--text-ghost); }

  .fire-btn {
    width: 42px; height: 42px;
    background: var(--neon);
    border: none;
    border-radius: var(--r-md);
    color: #08080a;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    font-weight: 700;
  }

  .fire-btn:hover { box-shadow: 0 0 16px var(--neon-glow); }
  .fire-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

  .typing-line {
    font-size: 10px;
    color: var(--text-ghost);
    padding: 3px 14px;
    min-height: 18px;
    flex-shrink: 0;
  }

  /* toast */
  .toast-el {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 11px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    font-family: var(--font);
  }

  .toast-el.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes msgPop { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
</style>
</head>
<body>

<!-- ===== ENTRY ===== -->
<div id="entry" class="screen active">
  <div class="brand">
    <div class="brand-icon">◈</div>
    <h1>Void</h1>
    <div class="tagline">chat cifrado · anónimo · P2P</div>
  </div>

  <div class="entry-panel">
    <button class="btn btn-neon" onclick="enterLobby()">
      ◈ Entrar al canal público
    </button>

    <button class="btn btn-ghost" onclick="makeRoom()">
      🔒 Crear sala privada
    </button>

    <div class="separator">unirse a sala</div>

    <div class="code-row">
      <input type="text" id="codeInput" placeholder="CÓDIGO" maxlength="6" autocomplete="off">
      <button class="btn btn-neon" onclick="joinRoom()">→</button>
    </div>

    <div class="info-box">
      <div class="feat"><span>🔐</span> Mensajes cifrados con AES-256-GCM</div>
      <div class="feat"><span>👤</span> Identidad anónima automática</div>
      <div class="feat"><span>🌐</span> Sin servidores — P2P descentralizado</div>
      <div class="feat"><span>🚫</span> Sin cuentas · sin registro · sin rastro</div>
    </div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div id="chatScreen" class="screen">
  <div class="top-bar">
    <button class="top-bar-back" onclick="leave()">←</button>
    <div class="top-bar-info">
      <h2 id="roomLabel">Canal público</h2>
      <div class="sub">
        <span class="dot-live"></span>
        <span id="peerCount">conectando...</span>
      </div>
    </div>
    <div class="lock-badge" id="lockBadge">🔐 E2E</div>
    <span class="code-pill" id="codePill" style="display:none" onclick="copyCode()"></span>
  </div>

  <div class="msg-scroll" id="msgScroll"></div>
  <div class="typing-line" id="typingLine"></div>

  <div class="input-bar">
    <textarea id="chatInput" rows="1" placeholder="Mensaje cifrado..." autocomplete="off"></textarea>
    <button class="fire-btn" id="fireBtn" onclick="fire()" disabled>↑</button>
  </div>
</div>

<div class="toast-el" id="toastEl"></div>

<!-- Gun.js P2P -->
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>

<script>
// ===== ANONYMOUS NAMES =====
const ADJECTIVES = [
  'silente','fugaz','nocturno','astral','errante','opaco','fantasma',
  'remoto','oculto','inverso','veloz','neutro','etéreo','lunar',
  'cripto','perdido','sutil','gris','denso','vago','frío','hondo',
  'raro','tenaz','firme','libre','cierto','breve','lento','agudo'
];
const NOUNS = [
  'lobo','cuervo','gato','búho','halcón','zorro','oso','lince',
  'tigre','león','cobra','delfín','pulpo','cóndor','puma','fénix',
  'dragón','reno','grulla','jaguar','bisonte','ciervo','huron','rata',
  'águila','morsa','koala','coyote','alce','ibis'
];

function randomAlias() {
  const a = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
  const n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
  const num = Math.floor(Math.random() * 100);
  return a + '-' + n + num;
}

function genCode() {
  const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let r = '';
  for (let i = 0; i < 5; i++) r += c[Math.floor(Math.random() * c.length)];
  return r;
}

// ===== ENCRYPTION (AES-256-GCM) =====
async function deriveKey(passphrase) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('void-salt-2024'), iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encrypt(text, key) {
  const enc = new TextEncoder();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  const buf = new Uint8Array(iv.length + ct.byteLength);
  buf.set(iv);
  buf.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...buf));
}

async function decrypt(b64, key) {
  try {
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = raw.slice(0, 12);
    const ct = raw.slice(12);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(pt);
  } catch {
    return null; // can't decrypt = different key/room
  }
}

// ===== STATE =====
let myAlias = '';
let roomId = '';
let roomCode = '';
let isPrivate = false;
let cryptoKey = null;
let gun = null;
let roomRef = null;
let lastSender = '';
let seenMsgs = new Set();

// ===== INIT =====
const storedAlias = sessionStorage.getItem('void_alias');
myAlias = storedAlias || randomAlias();
sessionStorage.setItem('void_alias', myAlias);

function toast(msg) {
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2600);
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== CONNECT GUN =====
function connectGun() {
  if (gun) return;
  gun = Gun({
    peers: [
      'https://gun-manhattan.herokuapp.com/gun',
      'https://gun-us.herokuapp.com/gun'
    ],
    localStorage: false
  });
}

// ===== ENTER ROOM =====
async function enterRoom(id, code, priv) {
  connectGun();
  roomId = id;
  roomCode = code;
  isPrivate = priv;

  // Derive encryption key from room name
  const passphrase = 'void-' + roomId + '-e2e';
  cryptoKey = await deriveKey(passphrase);

  // UI
  document.getElementById('roomLabel').textContent = priv ? '🔒 Sala privada' : '◈ Canal público';
  document.getElementById('codePill').style.display = priv ? '' : 'none';
  document.getElementById('codePill').textContent = code;
  show('chatScreen');

  const scroll = document.getElementById('msgScroll');
  scroll.innerHTML = '';
  lastSender = '';
  seenMsgs.clear();

  // System message
  addSys('conectado como ' + myAlias);
  addSys('cifrado E2E activo — AES-256-GCM');

  // Send join event
  const joinPayload = await encrypt(JSON.stringify({
    type: 'join',
    sender: myAlias,
    time: Date.now()
  }), cryptoKey);

  roomRef = gun.get('void-rooms').get(roomId);

  roomRef.get('stream').set({
    d: joinPayload,
    t: Date.now()
  });

  // Listen
  roomRef.get('stream').map().on(async (data) => {
    if (!data || !data.d) return;
    const msgKey = data.d.substring(0, 40);
    if (seenMsgs.has(msgKey)) return;
    seenMsgs.add(msgKey);

    const plain = await decrypt(data.d, cryptoKey);
    if (!plain) return;

    try {
      const obj = JSON.parse(plain);
      if (obj.type === 'join' && obj.sender !== myAlias) {
        addSys(obj.sender + ' se unió');
        updatePeers();
      } else if (obj.type === 'msg') {
        renderBubble(obj);
      } else if (obj.type === 'typing' && obj.sender !== myAlias) {
        showTyping(obj.sender);
      }
    } catch {}
  });

  updatePeers();
  document.getElementById('chatInput').focus();
}

// ===== ENTRY POINTS =====
function enterLobby() {
  enterRoom('public-lobby', '', false);
}

function makeRoom() {
  const code = genCode();
  enterRoom('priv-' + code, code, true);
  toast('Sala creada — comparte: ' + code);
}

function joinRoom() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code || code.length < 4) {
    toast('Introduce un código válido');
    return;
  }
  enterRoom('priv-' + code, code, true);
}

// ===== LEAVE =====
function leave() {
  if (roomRef) {
    roomRef.get('stream').off();
  }
  roomRef = null;
  show('entry');
}

// ===== RENDER =====
function renderBubble(obj) {
  const scroll = document.getElementById('msgScroll');
  const mine = obj.sender === myAlias;
  const newSender = obj.sender !== lastSender;

  if (newSender && scroll.children.length > 0) {
    const gap = document.createElement('div');
    gap.className = 'bubble-gap';
    scroll.appendChild(gap);
  }

  const div = document.createElement('div');
  div.className = 'bubble ' + (mine ? 'me' : 'them');

  if (newSender) {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = mine ? 'tú' : obj.sender;
    if (!mine) who.style.color = aliasColor(obj.sender);
    div.appendChild(who);
  }

  const txt = document.createElement('div');
  txt.textContent = obj.text;
  div.appendChild(txt);

  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = new Date(obj.time).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  div.appendChild(ts);

  scroll.appendChild(div);
  lastSender = obj.sender;
  scroll.scrollTop = scroll.scrollHeight;
}

function addSys(text) {
  const scroll = document.getElementById('msgScroll');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  scroll.appendChild(div);
  lastSender = '';
  scroll.scrollTop = scroll.scrollHeight;
}

function aliasColor(name) {
  const colors = ['#00e59b','#a78bfa','#60a5fa','#fbbf24','#f472b6','#34d399','#fb923c','#c084fc'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

// ===== SEND =====
async function fire() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !roomRef) return;

  const payload = await encrypt(JSON.stringify({
    type: 'msg',
    sender: myAlias,
    text: text,
    time: Date.now()
  }), cryptoKey);

  roomRef.get('stream').set({
    d: payload,
    t: Date.now()
  });

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('fireBtn').disabled = true;
}

// ===== TYPING =====
let typingTimer = null;
let typingClearTimer = null;

function showTyping(name) {
  document.getElementById('typingLine').textContent = name + ' escribe...';
  clearTimeout(typingClearTimer);
  typingClearTimer = setTimeout(() => {
    document.getElementById('typingLine').textContent = '';
  }, 3500);
}

// ===== INPUT =====
const chatInput = document.getElementById('chatInput');

chatInput.addEventListener('input', async () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
  document.getElementById('fireBtn').disabled = !chatInput.value.trim();

  // typing signal (throttled)
  if (!typingTimer && roomRef) {
    const payload = await encrypt(JSON.stringify({
      type: 'typing',
      sender: myAlias,
      time: Date.now()
    }), cryptoKey);
    roomRef.get('stream').set({ d: payload, t: Date.now() });
    typingTimer = setTimeout(() => { typingTimer = null; }, 2500);
  }
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    fire();
  }
});

// ===== PEERS (approximation) =====
function updatePeers() {
  // Gun doesn't track presence easily — we show "cifrado" as status
  document.getElementById('peerCount').textContent = 'cifrado activo';
}

// ===== COPY CODE =====
function copyCode() {
  navigator.clipboard.writeText(roomCode).then(() => {
    toast('Código copiado: ' + roomCode);
  }).catch(() => toast('Código: ' + roomCode));
}

// ===== ENTER KEY =====
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});
</script>

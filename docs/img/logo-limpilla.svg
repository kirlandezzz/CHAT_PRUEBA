<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Limpilla - Bio-solución para la Tunera">
  <title>Limpilla</title>
  <!-- Círculo verde exterior -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#6b9a5e" stroke-width="8"/>

  <!-- Tunera (pala de nopal) -->
  <g transform="translate(175, 110)">
    <!-- Pala -->
    <path d="M 80 30
             C 30 30, 10 80, 15 150
             C 18 220, 40 280, 80 300
             C 120 280, 142 220, 145 150
             C 150 80, 130 30, 80 30 Z"
          fill="#7fa867" stroke="#4e7241" stroke-width="3"/>
    <!-- Puntos (espinas) -->
    <g fill="#4e7241">
      <circle cx="55" cy="70" r="2"/>
      <circle cx="105" cy="75" r="2"/>
      <circle cx="40" cy="130" r="2"/>
      <circle cx="120" cy="135" r="2"/>
      <circle cx="60" cy="200" r="2"/>
      <circle cx="110" cy="205" r="2"/>
      <circle cx="80" cy="260" r="2"/>
    </g>
    <!-- Cochinillas blancas -->
    <g fill="#ffffff" stroke="#333" stroke-width="0.8">
      <ellipse cx="50" cy="85" rx="7" ry="5"/>
      <ellipse cx="68" cy="95" rx="7" ry="5"/>
      <ellipse cx="85" cy="80" rx="7" ry="5"/>
      <ellipse cx="45" cy="110" rx="7" ry="5"/>
      <ellipse cx="65" cy="125" rx="7" ry="5"/>
      <ellipse cx="82" cy="115" rx="7" ry="5"/>
      <ellipse cx="100" cy="100" rx="7" ry="5"/>
      <ellipse cx="55" cy="145" rx="7" ry="5"/>
      <ellipse cx="78" cy="155" rx="7" ry="5"/>
      <ellipse cx="95" cy="140" rx="7" ry="5"/>
      <ellipse cx="40" cy="170" rx="6" ry="4"/>
      <ellipse cx="70" cy="180" rx="6" ry="4"/>
      <ellipse cx="92" cy="170" rx="6" ry="4"/>
    </g>
    <!-- Swoosh verde -->
    <path d="M 10 180 Q 80 120, 150 180 Q 80 230, 10 180 Z"
          fill="#6b9a5e" opacity="0.9"/>
    <path d="M 10 180 Q 80 120, 150 180"
          fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Gota de aceite amarilla -->
  <g transform="translate(340, 230)">
    <path d="M 0 0 C -20 25, -20 50, 0 60 C 20 50, 20 25, 0 0 Z"
          fill="#f4c542" stroke="#c9a227" stroke-width="1.5"/>
    <ellipse cx="-5" cy="15" rx="4" ry="8" fill="#ffdd7a" opacity="0.7"/>
  </g>

  <!-- Islas Canarias estilizadas -->
  <g transform="translate(130, 340)" fill="#f4c542">
    <ellipse cx="0" cy="0" rx="8" ry="4" transform="rotate(-20)"/>
    <ellipse cx="20" cy="5" rx="6" ry="3" transform="rotate(15 20 5)"/>
    <circle cx="35" cy="10" r="3"/>
    <circle cx="48" cy="8" r="2.5"/>
    <circle cx="58" cy="12" r="2"/>
    <circle cx="68" cy="14" r="1.5"/>
    <circle cx="75" cy="18" r="1.2"/>
  </g>

  <!-- LIMPILLA texto -->
  <g font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="54" text-anchor="middle">
    <text x="165" y="410" fill="#3b8bc7">LIM</text>
    <text x="250" y="410" fill="#6b9a5e">PI</text>
    <text x="335" y="410" fill="#e8a53c">LLA</text>
  </g>

  <!-- Tagline -->
  <text x="250" y="440" text-anchor="middle"
        font-family="'Arial', sans-serif" font-size="16" fill="#555">
    Bio-solución para la Tunera
  </text>
</svg>
